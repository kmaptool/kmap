<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="35" y1="10" x2="480" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F8BB8"/>
      <stop offset="1" stop-color="#1D668E"/>
    </linearGradient>
    <linearGradient id="paper" x1="100" y1="100" x2="430" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#EAF2F5"/>
      <stop offset="1" stop-color="#B7C8D0"/>
    </linearGradient>
    <linearGradient id="route" x1="105" y1="315" x2="405" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD34D"/>
      <stop offset=".52" stop-color="#FFD95B"/>
      <stop offset="1" stop-color="#FFC62D"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="92"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
