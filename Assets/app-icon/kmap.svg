    <!-- folded map shadow -->
    <path d="M94 139 L214 82 L332 139 L425 82 L425 389 L332 439 L214 383 L94 444 Z"
          fill="none" stroke="#0B4D6C" stroke-width="12" opacity=".25" filter="url(#softShadow)"/>

    <!-- map body, single folded outline -->
    <path d="M94 139 L214 82 L332 139 L425 82 L425 389 L332 439 L214 383 L94 444 Z"
          fill="none" stroke="url(#paper)" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- fold seams -->
    <path d="M214 82 L214 383 M332 139 L332 439"
          fill="none" stroke="#D4E3E9" stroke-width="15" stroke-linecap="round"/>
    <path d="M214 82 L214 383 M332 139 L332 439"
